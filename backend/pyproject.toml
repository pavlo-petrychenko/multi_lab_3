[project]
name = "lab3-compression"
version = "1.0.0"
description = "Lossy image compression with hand-written DCT and Haar DWT (Lab 3)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.16",
    "matplotlib>=3.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
